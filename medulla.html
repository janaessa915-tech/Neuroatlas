<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


const canvas = document.getElementById("brainCanvas");


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();


/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
    40,
    1,
    0.1,
    100
);

camera.position.set(0, 0.4, 8);


/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true,
    alpha: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 2)
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;


/* =========================
   LIGHTS
========================= */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x152536,
        3
    )
);

const light = new THREE.DirectionalLight(
    0xffffff,
    4
);

light.position.set(4,6,8);

scene.add(light);

const blueLight = new THREE.DirectionalLight(
    0x5ebcff,
    2
);

blueLight.position.set(-5,2,5);

scene.add(blueLight);


/* =========================
   BRAIN
========================= */

const brain = new THREE.Group();

scene.add(brain);


/* =========================
   MATERIAL
========================= */

const brainMaterial =
new THREE.MeshStandardMaterial({

    color:0xc7ced6,

    roughness:0.8,

    metalness:0

});


const darkMaterial =
new THREE.MeshStandardMaterial({

    color:0x8e9aa6,

    roughness:0.85

});


const medullaMaterial =
new THREE.MeshStandardMaterial({

    color:0xff3973,

    emissive:0xff1550,

    emissiveIntensity:2.5,

    roughness:0.35

});


/* =========================
   CEREBRAL HEMISPHERES
========================= */

const hemisphereGeometry =
new THREE.SphereGeometry(
    2.25,
    48,
    32
);


/* LEFT */

const left =
new THREE.Mesh(
    hemisphereGeometry,
    brainMaterial
);

left.scale.set(
    1.05,
    1.15,
    1.25
);

left.position.set(
    -1.05,
    0.5,
    0
);

brain.add(left);


/* RIGHT */

const right =
new THREE.Mesh(
    hemisphereGeometry.clone(),
    brainMaterial.clone()
);

right.scale.set(
    1.05,
    1.15,
    1.25
);

right.position.set(
    1.05,
    0.5,
    0
);

brain.add(right);


/* =========================
   CENTER FISSURE
========================= */

const fissure =
new THREE.Mesh(

    new THREE.BoxGeometry(
        0.12,
        4,
        3.5
    ),

    new THREE.MeshBasicMaterial({
        color:0x050b13
    })

);

fissure.position.y =
0.5;

brain.add(fissure);


/* =========================
   BRAIN FOLDS
========================= */

function fold(
    x,
    y,
    z,
    scaleX,
    rotationZ
){

    const geometry =
    new THREE.TorusGeometry(
        0.65,
        0.045,
        8,
        32
    );

    const mesh =
    new THREE.Mesh(
        geometry,
        darkMaterial
    );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.scale.set(
        scaleX,
        0.45,
        0.55
    );

    mesh.rotation.x =
    Math.PI / 2;

    mesh.rotation.z =
    rotationZ;

    brain.add(mesh);
}


/* LEFT FOLDS */

fold(-1.6,1.2,1.9,.9,.2);
fold(-1.8,.6,2.0,1.0,-.15);
fold(-1.65,0.0,2.0,.9,.2);
fold(-1.3,-.55,1.85,.8,-.2);


/* RIGHT FOLDS */

fold(1.6,1.2,1.9,.9,-.2);
fold(1.8,.6,2.0,1.0,.15);
fold(1.65,0.0,2.0,.9,-.2);
fold(1.3,-.55,1.85,.8,.2);


/* =========================
   CEREBELLUM
========================= */

const cerebellum =
new THREE.Mesh(

    new THREE.SphereGeometry(
        1.15,
        40,
        28
    ),

    darkMaterial
);

cerebellum.scale.set(
    1.4,
    0.7,
    0.9
);

cerebellum.position.set(
    0,
    -0.75,
    -1.75
);

brain.add(cerebellum);


/* =========================
   BRAINSTEM
========================= */

const brainstem =
new THREE.Mesh(

    new THREE.CapsuleGeometry(
        0.4,
        1.5,
        12,
        24
    ),

    darkMaterial
);

brainstem.position.set(
    0,
    -1.25,
    -0.55
);

brain.add(brainstem);


/* =========================
   MEDULLA
========================= */

const medulla =
new THREE.Mesh(

    new THREE.CapsuleGeometry(
        0.27,
        0.7,
        12,
        24
    ),

    medullaMaterial
);

medulla.scale.set(
    0.9,
    1.2,
    0.8
);

medulla.position.set(
    0,
    -2.05,
    -0.55
);

brain.add(medulla);


/* =========================
   SPINAL CORD
========================= */

const spinalCord =
new THREE.Mesh(

    new THREE.CylinderGeometry(
        0.18,
        0.22,
        1.1,
        24
    ),

    darkMaterial
);

spinalCord.position.set(
    0,
    -2.9,
    -0.55
);

brain.add(spinalCord);


/* =========================
   MEDULLA GLOW
========================= */

const glow =
new THREE.PointLight(
    0xff286d,
    3,
    2
);

glow.position.copy(
    medulla.position
);

brain.add(glow);


/* =========================
   CONTROLS
========================= */

const controls =
new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.07;

controls.enableZoom = true;

controls.enablePan = false;

controls.minDistance = 5;

controls.maxDistance = 12;

controls.target.set(
    0,
    -0.3,
    0
);


/* =========================
   RESIZE
========================= */

function resize(){

    const width =
    canvas.clientWidth;

    const height =
    canvas.clientHeight;

    if(width === 0 || height === 0)
        return;

    camera.aspect =
    width / height;

    camera.updateProjectionMatrix();

    renderer.setSize(
        width,
        height,
        false
    );
}

window.addEventListener(
    "resize",
    resize
);


/* =========================
   BUTTONS
========================= */

document
.getElementById("resetButton")
.onclick = function(){

    camera.position.set(
        0,
        0.4,
        8
    );

    controls.target.set(
        0,
        -0.3,
        0
    );

    controls.update();
};


document
.getElementById("rotateButton")
.onclick = function(){

    controls.autoRotate =
    !controls.autoRotate;

    controls.autoRotateSpeed =
    0.6;
};


document
.getElementById("focusButton")
.onclick = function(){

    camera.position.set(
        1.4,
        -1.5,
        4
    );

    controls.target.set(
        0,
        -2,
        -0.5
    );

    controls.update();
};


/* =========================
   ANIMATION
========================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );
}


resize();

animate();

</script>
