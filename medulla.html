<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("brainCanvas");
const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");
const medullaLabel = document.getElementById("medullaLabel");


/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x02070d);


/* =====================================================
   CAMERA
===================================================== */

const camera = new THREE.PerspectiveCamera(
    35,
    1,
    0.01,
    100
);

camera.position.set(
    0,
    1.1,
    8
);


/* =====================================================
   RENDERER
===================================================== */

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;


/* =====================================================
   CONTROLS
===================================================== */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.07;

controls.enableZoom = true;
controls.zoomSpeed = 0.8;

controls.enablePan = false;

controls.minDistance = 4;
controls.maxDistance = 14;

controls.target.set(
    0,
    0.5,
    0
);


/* =====================================================
   LIGHTING
===================================================== */

scene.add(
    new THREE.HemisphereLight(
        0xbfdcff,
        0x07111d,
        2.5
    )
);

const keyLight =
new THREE.DirectionalLight(
    0xffffff,
    4
);

keyLight.position.set(
    4,
    6,
    7
);

scene.add(keyLight);


const rimLight =
new THREE.DirectionalLight(
    0x4da6ff,
    3
);

rimLight.position.set(
    -5,
    2,
    -5
);

scene.add(rimLight);


const frontLight =
new THREE.PointLight(
    0xffffff,
    1.5,
    15
);

frontLight.position.set(
    0,
    2,
    6
);

scene.add(frontLight);


/* =====================================================
   BRAIN GROUP
===================================================== */

const brain = new THREE.Group();

scene.add(brain);


/* =====================================================
   MATERIALS
===================================================== */

const brainMaterial =
new THREE.MeshStandardMaterial({

    color: 0xb9c2cc,

    roughness: 0.78,

    metalness: 0.02

});


const cerebellumMaterial =
new THREE.MeshStandardMaterial({

    color: 0x9faab6,

    roughness: 0.8

});


const brainstemMaterial =
new THREE.MeshStandardMaterial({

    color: 0xaeb8c3,

    roughness: 0.8

});


const medullaMaterial =
new THREE.MeshStandardMaterial({

    color: 0xff3f78,

    emissive: 0xff174f,

    emissiveIntensity: 1.8,

    roughness: 0.45

});


/* =====================================================
   HELPER: SMOOTH BRAIN LOBE
===================================================== */

function createLobe(
    x,
    y,
    z,
    sx,
    sy,
    sz
){

    const geometry =
    new THREE.SphereGeometry(
        1,
        48,
        32
    );

    const mesh =
    new THREE.Mesh(
        geometry,
        brainMaterial
    );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.scale.set(
        sx,
        sy,
        sz
    );

    brain.add(mesh);

    return mesh;
}


/* =====================================================
   CEREBRAL HEMISPHERES
===================================================== */

const leftBrain =
createLobe(
    -1.05,
    1.05,
    0,
    1.65,
    1.55,
    1.38
);

const rightBrain =
createLobe(
    1.05,
    1.05,
    0,
    1.65,
    1.55,
    1.38
);


/* =====================================================
   MAKE THE BRAIN LESS PERFECTLY ROUND
===================================================== */

const frontalLeft =
createLobe(
    -1.35,
    1.35,
    0.25,
    1.15,
    1.15,
    1.25
);

const frontalRight =
createLobe(
    1.35,
    1.35,
    0.25,
    1.15,
    1.15,
    1.25
);


/* =====================================================
   OCCIPITAL REGION
===================================================== */

createLobe(
    -0.95,
    0.75,
    -0.75,
    1.05,
    1.15,
    0.95
);

createLobe(
    0.95,
    0.75,
    -0.75,
    1.05,
    1.15,
    0.95
);


/* =====================================================
   CENTRAL FISSURE
===================================================== */

const fissure =
new THREE.Mesh(

    new THREE.BoxGeometry(
        0.10,
        2.5,
        1.8
    ),

    new THREE.MeshBasicMaterial({
        color:0x182532
    })

);

fissure.position.set(
    0,
    1.1,
    0
);

brain.add(fissure);


/* =====================================================
   CEREBELLUM
===================================================== */

const cerebellum =
new THREE.Group();

brain.add(cerebellum);


const cerebellumMain =
new THREE.Mesh(

    new THREE.SphereGeometry(
        1,
        48,
        32
    ),

    cerebellumMaterial

);

cerebellumMain.scale.set(
    1.25,
    0.75,
    0.85
);

cerebellumMain.position.set(
    0,
    -0.15,
    -0.85
);

cerebellum.add(
    cerebellumMain
);


/* =====================================================
   CEREBELLAR FOLIA
===================================================== */

for(
    let i = 0;
    i < 11;
    i++
){

    const folia =
    new THREE.Mesh(

        new THREE.TorusGeometry(
            0.72 - i * 0.025,
            0.018,
            8,
            48
        ),

        new THREE.MeshStandardMaterial({
            color:0x707d8b,
            roughness:0.9
        })

    );

    folia.rotation.x =
    Math.PI / 2;

    folia.position.set(
        0,
        -0.58 + i * 0.075,
        -1.42
    );

    folia.scale.x =
    1.25 - i * 0.035;

    cerebellum.add(
        folia
    );
}


/* =====================================================
   BRAINSTEM
===================================================== */

const brainstem =
new THREE.Group();

brain.add(brainstem);


/* Pons */

const pons =
new THREE.Mesh(

    new THREE.SphereGeometry(
        1,
        40,
        32
    ),

    brainstemMaterial

);

pons.scale.set(
    0.52,
    0.55,
    0.48
);

pons.position.set(
    0,
    -0.75,
    0
);

brainstem.add(pons);


/* =====================================================
   MEDULLA
===================================================== */

const medulla =
new THREE.Mesh(

    new THREE.CapsuleGeometry(
        0.34,
        1.05,
        16,
        32
    ),

    medullaMaterial

);

medulla.scale.set(
    0.95,
    1,
    0.85
);

medulla.position.set(
    0,
    -1.55,
    0
);

brainstem.add(
    medulla
);


/* =====================================================
   SPINAL CORD
===================================================== */

const spinalCord =
new THREE.Mesh(

    new THREE.CylinderGeometry(
        0.18,
        0.22,
        1.2,
        32
    ),

    brainstemMaterial

);

spinalCord.position.set(
    0,
    -2.55,
    0
);

brainstem.add(
    spinalCord
);


/* =====================================================
   PYRAMIDS
===================================================== */

const pyramidMaterial =
new THREE.MeshStandardMaterial({

    color:0xcbd3dc,

    roughness:0.75

});


for(
    const x of [-0.13,0.13]
){

    const pyramid =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            0.075,
            0.65,
            8,
            16
        ),

        pyramidMaterial

    );

    pyramid.position.set(
        x,
        -1.63,
        0.28
    );

    pyramid.rotation.x =
    -0.08;

    brainstem.add(
        pyramid
    );
}


/* =====================================================
   MEDULLA GLOW
===================================================== */

const glow =
new THREE.PointLight(
    0xff2868,
    3.5,
    3
);

glow.position.copy(
    medulla.position
);

brainstem.add(glow);


/* =====================================================
   MEDULLA OUTLINE RING
===================================================== */

const ring =
new THREE.Mesh(

    new THREE.TorusGeometry(
        0.37,
        0.025,
        12,
        48
    ),

    new THREE.MeshBasicMaterial({
        color:0xff477d
    })

);

ring.rotation.x =
Math.PI / 2;

ring.position.copy(
    medulla.position
);

ring.position.z += 0.28;

brainstem.add(
    ring
);


/* =====================================================
   CENTER EVERYTHING
===================================================== */

brain.position.set(
    0,
    0,
    0
);


/* =====================================================
   LABEL
===================================================== */

medullaLabel.classList.add(
    "visible"
);


/* =====================================================
   LOADING
===================================================== */

loadingText.textContent =
"Brain model ready ✓";

setTimeout(
    () => {
        loading.style.display =
        "none";
    },
    500
);


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    const width =
    canvas.clientWidth;

    const height =
    canvas.clientHeight;

    if(
        width <= 0 ||
        height <= 0
    ){
        return;
    }

    camera.aspect =
    width / height;

    camera.updateProjectionMatrix();

    renderer.setSize(
        width,
        height,
        false
    );
}

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   BUTTONS
===================================================== */

document
.getElementById("resetButton")
.addEventListener(
    "click",
    () => {

        camera.position.set(
            0,
            1.1,
            8
        );

        controls.target.set(
            0,
            0.5,
            0
        );

        controls.update();

    }
);


document
.getElementById("rotateButton")
.addEventListener(
    "click",
    () => {

        controls.autoRotate =
        !controls.autoRotate;

    }
);


document
.getElementById("focusButton")
.addEventListener(
    "click",
    () => {

        camera.position.set(
            2.2,
            -1.2,
            3.2
        );

        controls.target.set(
            0,
            -1.3,
            0
        );

        controls.update();

    }
);


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

resize();

animate();

</script>
