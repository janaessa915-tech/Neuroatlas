<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Midbrain | NeuroAtlas</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#07111f;
color:#f4f7fb;
line-height:1.7;
}

nav{
padding:22px 7%;
border-bottom:1px solid rgba(255,255,255,.08);
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
color:white;
text-decoration:none;
}

.logo span{
color:#4da6ff;
}

.nav-links{
display:flex;
gap:25px;
}

.nav-links a{
color:#aebdce;
text-decoration:none;
font-size:14px;
}

.nav-links a:hover{
color:white;
}

.container{
max-width:1100px;
margin:auto;
padding:70px 7%;
}

.label{
color:#4da6ff;
text-transform:uppercase;
letter-spacing:2px;
font-size:13px;
margin-bottom:12px;
}

h1{
font-size:clamp(45px,7vw,76px);
line-height:1.05;
margin-bottom:8px;
}

.arabic{
color:#7ebcff;
font-size:25px;
margin-bottom:28px;
}

.intro{
color:#aebdce;
font-size:18px;
max-width:780px;
margin-bottom:45px;
}


/* LOCATION CARD */

.location-card{
padding:30px;
background:rgba(255,255,255,.035);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
margin-bottom:30px;
}

.location-button{
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
background:none;
border:none;
color:#f4f7fb;
font-size:22px;
font-weight:bold;
cursor:pointer;
text-align:left;
padding:0;
font-family:Arial,sans-serif;
}

.location-button:hover{
color:#7ebcff;
}

.location-button span:last-child{
color:#4da6ff;
font-size:28px;
}

.location-preview{
color:#9fb0c3;
margin-top:10px;
}

.location-map{
display:none;
margin-top:30px;
padding-top:30px;
border-top:1px solid rgba(255,255,255,.08);
}

.location-map.active{
display:block;
animation:fadeIn .35s ease;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(8px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.map-title{
color:#aebdce;
font-size:15px;
margin-bottom:20px;
}

.brain-map{
width:100%;
max-width:850px;
display:block;
margin:auto;
background:#091727;
border-radius:16px;
border:1px solid rgba(255,255,255,.08);
}

.brain-outline{
fill:#172b42;
stroke:#526b86;
stroke-width:3;
}

.brain-detail{
fill:none;
stroke:#344d68;
stroke-width:2;
}

.midbrain{
fill:#4da6ff;
stroke:#b8ddff;
stroke-width:3;
filter:drop-shadow(0 0 9px rgba(77,166,255,.8));
animation:pulse 2s infinite;
}

@keyframes pulse{

0%,100%{
opacity:1;
}

50%{
opacity:.65;
}

}

.label-line{
stroke:#7ebcff;
stroke-width:2;
stroke-dasharray:5 4;
}

.map-label{
fill:white;
font-size:17px;
font-weight:bold;
}

.map-small{
fill:#9fb0c3;
font-size:13px;
}

.location-explanation{
margin-top:22px;
padding:22px;
background:#0a1728;
border-radius:12px;
border-left:3px solid #4da6ff;
color:#aebdce;
}

.location-explanation strong{
color:#7ebcff;
}


/* CONTENT CARDS */

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{
padding:28px;
background:rgba(255,255,255,.035);
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
transition:.25s;
}

.card:hover{
transform:translateY(-4px);
border-color:rgba(77,166,255,.45);
}

.card h2{
font-size:20px;
margin-bottom:12px;
}

.card p{
color:#aebdce;
}


/* INSIGHT */

.insight{
margin-top:30px;
padding:30px;
border-left:3px solid #4da6ff;
background:#0a1728;
border-radius:10px;
}

.insight strong{
color:#7ebcff;
}


/* QUIZ */

.quiz{
margin-top:55px;
padding:35px;
background:#0a1728;
border:1px solid rgba(77,166,255,.2);
border-radius:18px;
}

.quiz h2{
margin-bottom:20px;
}

.option{
display:block;
width:100%;
text-align:left;
padding:14px 16px;
margin-top:10px;
border-radius:10px;
border:1px solid #263951;
background:#0d2035;
color:white;
cursor:pointer;
font-size:15px
